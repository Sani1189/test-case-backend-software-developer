# Pipeline configuration.
#
# Every field is required. There are no built-in defaults to fall back on: a missing
# or misspelled key stops the run at startup with a message naming the key, rather
# than running with a value nobody chose.
#
# Values here can be overridden by an allowlisted set of environment variables
# (TRACKBOX_VIDEO_PATH, TRACKBOX_TARGET_FPS, TRACKBOX_API_URL, TRACKBOX_LOG_LEVEL,
# TRACKBOX_LOG_FORMAT). See src/trackbox_pitch/config.py. Overrides are validated by
# the same rules as this file.

video:
  # The synthetic feed, generated by tools/synthetic_generator.py. Generated videos
  # are gitignored, so this file must exist at run time -- the pipeline reports a
  # clear input error rather than silently generating one.
  path: synthetic_pitch_feed.mp4

  # The prototype instead processed all 1800 frames of a 30fps feed. Analysing at
  # 5fps means roughly one frame in six is decoded and inspected, which is the
  # difference between cost tracking the work needed and cost tracking file length.
  target_fps: 5.0

field_detector:
  type: green_threshold
  sport: football
  min_area: 1000
  hsv_lower: [35, 40, 40]
  hsv_upper: [85, 255, 255]

aggregation:
  min_confidence: 0.5
  consensus_polygon_window: 60

  # Convergence early-exit is off by default. It genuinely makes a longer feed cost
  # less for the same analysis, but it stops looking before the end, so it is opt-in
  # rather than the default behaviour.
  early_exit: false
  min_valid_samples: 120
  relative_stderr_threshold: 0.02

reporting:
  enabled: true
  # Container-to-container DNS name; override with TRACKBOX_API_URL for local runs.
  api_url: http://mock_api:5000
  timeout_seconds: 2.0
  max_attempts: 3
  progress_every_frames: 250
  progress_every_seconds: 10.0

logging:
  level: INFO
  format: json
